<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
 <link rel="stylesheet" href="Calculater.css">
</head>
<body>
  <div class="container">
    <input type="text" id="display" readonly>

    <div class="btn-container">
      <button class="box" onclick="press('7')">7</button>
      <button class="box" onclick="press('8')">8</button>
      <button class="box" onclick="press('9')">9</button>
      <button class="box delete" onclick="del()">DEL</button>

      <button class="box" onclick="press('4')">4</button>
      <button class="box" onclick="press('5')">5</button>
      <button class="box" onclick="press('6')">6</button>
      <button class="box" onclick="press('+')">+</button>

      <button class="box" onclick="press('1')">1</button>
      <button class="box" onclick="press('2')">2</button>
      <button class="box" onclick="press('3')">3</button>
      <button class="box" onclick="press('-')">-</button>

      <button class="box" onclick="press('.')">.</button>
      <button class="box" onclick="press('0')">0</button>
      <button class="box" onclick="press('/')">/</button>
      <button class="box" onclick="press('*')">*</button>

      <button class="reset" onclick="resetDisplay()">RESET</button>
      <button class="equal" onclick="equal()">=</button>
    </div>
  </div>

  <script src="Calculater.js"></script>
</body>
</html>
