git<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculater</title>
    <link rel="stylesheet" href="Calculater.css">
</head>
<body>
    <div class="Contianer">
        <input type="number" id="display" readonly>
        <div class="btn-contianer">
            <button inputmode="number" class="box"onclick="press('7')">7</button>
            <button inputmode="number" class="box"onclick="press('8')">8</button>
            <button inputmode="number" class="box" onclick="press('9')">9</button>
            <button inputmode="number" class="box" onclick="Del()">DEL</button>
            <br>
            <button inputmode="number" class="box" onclick="press('4')">4</button>
            <button inputmode="number" class="box" onclick="press('5')">5</button>
            <button inputmode="number" class="box" onclick="press('6')">6</button>
            <button inputmode="number" class="box" onclick="press('+')">+</button>
            <br>
            <button inputmode="number" class="box" onclick="press('1')">1</button>
            <button inputmode="number" class="box" onclick="press('2')">2</button>
            <button inputmode="number" class="box" onclick="press('3')">3</button>
            <button inputmode="number" class="box" onclick="press('-')">-</button>
            <br>
            <button inputmode="number" class="box" onclick="press('.')">.</button>
            <button inputmode="number" class="box" onclick="press('0')">0</button>
            <button inputmode="number" class="box" onclick="press('/')">/</button>
            <button inputmode="number" class="box" onclick="press('*')">*</button>
            <button inputmode="number" onclick="Resat()">RERSET</button>
            <button inputmode="number" onclick="equal()">=</button>
        </div>
    </div> 
    <script src="Calculater.js"></script>
</body>
</html>
